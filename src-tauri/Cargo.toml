[package]
name = "city-tiles-pos"
version = "1.0.0"
description = "City Tiles POS - Offline Point of Sale System"
authors = ["AUZ tech"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "city_tiles_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.11.3", features = ["default"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

tokio = { version = "1", features = ["full"] }

# Auth & Security
jsonwebtoken = "9"
bcrypt = "0.16"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
once_cell = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Printing
rusb = "0.9"
escpos-rs = "0.4"

# CSV import (for product catalog import)
csv = "1.3"

# PDF Generation
genpdf = "0.2"

# Windows-specific for ESC/POS fallback
#[cfg(target_os = "windows")]
windows = { version = "0.58", features = [
    "Win32_Graphics_Printing",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
